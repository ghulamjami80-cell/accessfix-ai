// ==========================================
// CLIENT-SIDE HTML DOM PARSER (MICRO SCANNER)
// ==========================================
function runClientSideDomScan(htmlString, targetUrl) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlString, 'text/html');
  const issues = [];
  let issueCounter = 1;

  // Rule 1: Check Images for missing ALT
  const images = doc.querySelectorAll('img');
  images.forEach((img, idx) => {
    if (!img.hasAttribute('alt')) {
      issues.push({
        id: `client-rule-${issueCounter++}`,
        ruleId: 'image-alt',
        wcag: '1.1.1 Non-text Content (Level A)',
        principle: 'perceivable',
        severity: 'critical',
        title: 'Image missing `alt` attribute',
        description: `Found <img> element without an alt attribute.`,
        element: img.outerHTML.substring(0, 150),
        selector: img.id ? `#${img.id}` : `img:nth-of-type(${idx + 1})`,
        explanation: 'Screen readers cannot describe this image to visually impaired users.',
        beforeCode: img.outerHTML.substring(0, 180),
        afterCode: img.outerHTML.replace('<img', '<img alt="Descriptive text here"'),
        fixGuide: 'Add an `alt` attribute describing the content or purpose of the image.',
        impact: 95
      });
    }
  });

  // Rule 2: Check Input controls for labels
  const inputs = doc.querySelectorAll('input:not([type="hidden"]):not([type="submit"]):not([type="button"])');
  inputs.forEach((input, idx) => {
    const id = input.getAttribute('id');
    const hasLabel = id ? doc.querySelector(`label[for="${id}"]`) : false;
    const hasAriaLabel = input.hasAttribute('aria-label') || input.hasAttribute('aria-labelledby');

    if (!hasLabel && !hasAriaLabel) {
      issues.push({
        id: `client-rule-${issueCounter++}`,
        ruleId: 'label',
        wcag: '3.3.2 Labels or Instructions (Level A)',
        principle: 'understandable',
        severity: 'critical',
        title: 'Form input missing associated label',
        description: 'Input control has no associated <label> or aria-label attribute.',
        element: input.outerHTML.substring(0, 150),
        selector: id ? `#${id}` : `input:nth-of-type(${idx + 1})`,
        explanation: 'Assistive technologies cannot determine the purpose of this input field.',
        beforeCode: input.outerHTML,
        afterCode: id 
          ? `<label for="${id}">Field Label</label>\n${input.outerHTML}`
          : `<label for="field-${idx}">Field Label</label>\n${input.outerHTML.replace('<input', `<input id="field-${idx}"`)}`,
        fixGuide: 'Link an explicit `<label for="id">` or add `aria-label="Name"`.',
        impact: 90
      });
    }
  });

  // Rule 3: Check Document HTML lang attribute
  const htmlTag = doc.querySelector('html');
  if (!htmlTag || !htmlTag.getAttribute('lang')) {
    issues.push({
      id: `client-rule-${issueCounter++}`,
      ruleId: 'html-has-lang',
      wcag: '3.1.1 Language of Page (Level A)',
      principle: 'understandable',
      severity: 'serious',
      title: '`<html>` element missing `lang` attribute',
      description: 'The root HTML tag does not specify a language attribute.',
      element: '<html>',
      selector: 'html',
      explanation: 'Screen readers cannot choose the correct pronunciation voice rules without a primary language attribute.',
      beforeCode: '<html>',
      afterCode: '<html lang="en">',
      fixGuide: 'Specify the primary primary ISO language code on the root element, e.g. `<html lang="en">`.',
      impact: 85
    });
  }

  // Rule 4: Check links for empty or "click here" text
  const links = doc.querySelectorAll('a');
  links.forEach((a, idx) => {
    const text = a.textContent.trim().toLowerCase();
    if (!text && !a.querySelector('img[alt]') && !a.hasAttribute('aria-label')) {
      issues.push({
        id: `client-rule-${issueCounter++}`,
        ruleId: 'link-name',
        wcag: '2.4.4 Link Purpose (Level A)',
        principle: 'operable',
        severity: 'serious',
        title: 'Link has no text content or label',
        description: 'Anchor link is completely empty or lacks accessible name.',
        element: a.outerHTML.substring(0, 150),
        selector: `a:nth-of-type(${idx + 1})`,
        explanation: 'Users navigating via tab focus cannot tell where this link leads.',
        beforeCode: a.outerHTML,
        afterCode: a.outerHTML.replace('<a>', '<a aria-label="View target destination">'),
        fixGuide: 'Provide descriptive text inside the link or add an `aria-label`.',
        impact: 78
      });
    } else if (text === 'click here' || text === 'read more' || text === 'link') {
      issues.push({
        id: `client-rule-${issueCounter++}`,
        ruleId: 'link-name',
        wcag: '2.4.4 Link Purpose (In Context) (Level A)',
        principle: 'operable',
        severity: 'moderate',
        title: 'Non-descriptive link text',
        description: `Link relies on generic phrase "${text}".`,
        element: a.outerHTML.substring(0, 150),
        selector: `a:nth-of-type(${idx + 1})`,
        explanation: 'Generic text fails to communicate destination when isolated in screen reader link lists.',
        beforeCode: a.outerHTML,
        afterCode: `<a href="${a.getAttribute('href') || '#'}">Read complete report summary</a>`,
        fixGuide: 'Replace generic phrases with explicit destination descriptions.',
        impact: 65
      });
    }
  });

  // Calculate score based on issues
  const criticals = issues.filter(i => i.severity === 'critical').length;
  const serious = issues.filter(i => i.severity === 'serious').length;
  const moderate = issues.filter(i => i.severity === 'moderate').length;
  const minor = issues.filter(i => i.severity === 'minor').length;

  const totalDeduction = (criticals * 15) + (serious * 10) + (moderate * 5) + (minor * 2);
  const score = Math.max(10, 100 - totalDeduction);

  return {
    id: `client-scan-${Date.now()}`,
    name: targetUrl || 'Direct HTML DOM Inspection',
    url: targetUrl || 'Snippet Scan',
    score: score,
    scanDate: new Date().toISOString(),
    isDemo: false,
    summary: { critical: criticals, serious, moderate, minor },
    wcagCounts: {
      perceivable: issues.filter(i => i.principle === 'perceivable').length,
      operable: issues.filter(i => i.principle === 'operable').length,
      understandable: issues.filter(i => i.principle === 'understandable').length,
      robust: issues.filter(i => i.principle === 'robust').length
    },
    issues: issues
  };
}

function App() {
  // Navigation & View States
  const [activeTab, setActiveTab] = useState('scanner'); // 'scanner', 'history', 'demos', 'education', 'architecture', 'about', 'privacy', 'contact'
  const [scanMode, setScanMode] = useState('serverSim'); // 'serverSim' (axe-core engine) or 'clientSnippet' (DOM Micro Scan)

  // Form Inputs
  const [urlInput, setUrlInput] = useState('https://mysite.com');
  const [htmlSnippetInput, setHtmlSnippetInput] = useState(
    '<!DOCTYPE html>\n<html>\n<head><title>My Store</title></head>\n<body>\n  <img src="banner.jpg">\n  <input type="text" placeholder="Search product">\n  <a href="#">click here</a>\n</body>\n</html>'
  );

  // Scan Execution State
  const [isScanning, setIsScanning] = useState(false);
  const [scanProgress, setScanProgress] = useState(0);
  const [scanStatusText, setScanStatusText] = useState('');
  const [scanError, setScanError] = useState(null);

  // Scan Results State
  const [currentResult, setCurrentResult] = useState(DEMO_PRESETS[0]);
  const [scanHistory, setScanHistory] = useState([DEMO_PRESETS[0], DEMO_PRESETS[1]]);

  // Results Filter State
  const [severityFilter, setSeverityFilter] = useState('all');
  const [principleFilter, setPrincipleFilter] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [copiedId, setCopiedId] = useState(null);
  const [expandedIssueId, setExpandedIssueId] = useState(null);

  // Toast State
  const [toastMessage, setToastMessage] = useState(null);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3500);
  };

  // Perform Scan Logic
  const handleInitiateScan = (e) => {
    if (e) e.preventDefault();
    setScanError(null);

    if (scanMode === 'clientSnippet') {
      if (!htmlSnippetInput.trim()) {
        setScanError('Please enter valid HTML snippet markup to perform a client-side scan.');
        return;
      }
      setIsScanning(true);
      setScanProgress(30);
      setScanStatusText('Parsing DOM structure in client browser...');

      setTimeout(() => {
        setScanProgress(75);
        setScanStatusText('Executing client accessibility rule tree...');
        setTimeout(() => {
          try {
            const auditResult = runClientSideDomScan(htmlSnippetInput, 'HTML Snippet Direct Audit');
            setCurrentResult(auditResult);
            setScanHistory(prev => [auditResult, ...prev]);
            setIsScanning(false);
            setScanProgress(100);
            showToast('Client-side DOM scan completed successfully!');
          } catch (err) {
            setScanError('Failed to parse HTML code string: ' + err.message);
            setIsScanning(false);
          }
        }, 600);
      }, 500);
      return;
    }

    // Full Server Engine Simulation (axe-core pipeline)
    if (!urlInput.trim() || !urlInput.includes('.')) {
      setScanError('Please enter a valid target URL (e.g., https://example.com).');
      return;
    }

    setIsScanning(true);
    setScanProgress(10);
    setScanStatusText(`Connecting to audit target ${urlInput}...`);

    const steps = [
      { pct: 25, status: 'Fetching HTML payload & rendering DOM tree...' },
      { pct: 50, status: 'Initializing embedded axe-core accessibility engine...' },
      { pct: 75, status: 'Evaluating WCAG 2.1 AA color contrast & target rules...' },
      { pct: 90, status: 'Generating AI remediation guides and before/after fixes...' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < steps.length) {
        setScanProgress(steps[currentStep].pct);
        setScanStatusText(steps[currentStep].status);
        currentStep++;
      } else {
        clearInterval(interval);
        
        // Build simulated result for the user's custom URL
        const simulatedResult = {
          id: `scan-${Date.now()}`,
          name: urlInput.replace(/^https?:\/\//, '').replace(/\/$/, ''),
          url: urlInput.startsWith('http') ? urlInput : `https://${urlInput}`,
          score: Math.floor(Math.random() * 25) + 65, // 65-90 score
          scanDate: new Date().toISOString(),
          isDemo: false,
          summary: { critical: 2, serious: 3, moderate: 4, minor: 2 },
          wcagCounts: { perceivable: 4, operable: 4, understandable: 2, robust: 1 },
          issues: [
            {
              id: `issue-gen-1`,
              ruleId: 'image-alt',
              wcag: '1.1.1 Non-text Content (Level A)',
              principle: 'perceivable',
              severity: 'critical',
              title: 'Primary logo image missing descriptive alternate text',

const puppeteer = require('puppeteer');
const { AxePuppeteer } = require('@axe-core/puppeteer');

const app = express();
app.use(express.json());

app.post('/api/scan', async (req, res) => {
  const { url } = req.body;
  if (!url) return res.status(400).json({ error: 'URL is required' });

});
